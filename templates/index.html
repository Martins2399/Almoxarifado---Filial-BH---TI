<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Almoxarifado - TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f4f6f9;
            color: #333;
        }
        .navbar {
            background: linear-gradient(135deg, #1e293b, #0f172a) !important;
            padding: 1rem 1.5rem;
        }
        .nav-tabs .nav-link {
            color: #495057;
            font-weight: 600;
            border: 1px solid transparent;
            border-top-left-radius: 0.375rem;
            border-top-right-radius: 0.375rem;
            background-color: #e9ecef;
            margin-right: 4px;
            transition: all 0.2s ease-in-out;
        }
        .nav-tabs .nav-link:hover {
            background-color: #dee2e6;
            color: #0d6efd;
        }
        .nav-tabs .nav-link.active {
            color: #fff !important;
            background-color: #0d6efd !important;
            border-color: #0d6efd #0d6efd #fff !important;
        }
        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border-radius: 0.5rem;
        }
        .table th {
            background-color: #212529 !important;
            color: #fff !important;
            font-weight: 600;
        }
        .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1 fs-4"><i class="fa-solid fa-boxes-stacked me-2"></i> Almoxarifado TI - Gestão por Localidades</span>
        </div>
    </nav>

    <div class="container my-5">
        
        <!-- ABAS DE LOCALIDADES -->
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <ul class="nav nav-tabs border-0" id="localidadesTabs">
                <!-- Abas injetadas via JavaScript -->
            </ul>
            <button class="btn btn-primary btn-sm shadow-sm px-3 py-2" data-bs-toggle="modal" data-bs-target="#modalNovaLocalidade">
                <i class="fa-solid fa-plus me-1"></i> Adicionar Localidade
            </button>
        </div>

        <div class="card shadow-sm mb-4 bg-white">
            <div class="card-body p-4">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h3 id="tituloLocalidade" class="text-dark fw-bold mb-1">Localidade: Belo Horizonte</h3>
                        <p class="text-muted mb-0">Gerenciamento de ativos, estoque e contratos de TI da filial selecionada.</p>
                    </div>
                    <div class="col-md-4 text-md-end mt-3 mt-md-0">
                        <button class="btn btn-success px-4 py-2 shadow-sm" data-bs-toggle="modal" data-bs-target="#modalProduto">
                            <i class="fa-solid fa-circle-plus me-1"></i> Novo Item
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TABELA DE PRODUTOS -->
        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th class="ps-3">Nome do Item</th>
                                <th>Categoria</th>
                                <th>Quantidade</th>
                                <th>Status</th>
                                <th class="text-end pe-3">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaProdutos">
                            <tr><td colspan="5" class="text-center py-4 text-muted">Carregando dados...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL ADICIONAR / EDITAR PRODUTO -->
    <div class="modal fade" id="modalProduto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formProduto">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title" id="modalProdutoTitulo">Cadastrar Novo Item</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="produtoId">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome do Item</label>
                            <input type="text" class="form-control" id="nomeProduto" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Categoria</label>
                            <input type="text" class="form-control" id="categoriaProduto" required placeholder="Ex: Hardwares, Cabos, Rede">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Quantidade Inicial</label>
                            <input type="number" class="form-control" id="quantidadeProduto" value="1" min="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Alerta Mínimo</label>
                            <input type="number" class="form-control" id="alertaMinimo" value="1" min="0" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Item</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL MOVIMENTAÇÃO (ENTRADA / SAÍDA) -->
    <div class="modal fade" id="modalMovimentacao" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formMovimentacao">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title">Registrar Movimentação</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <input type="hidden" id="movProdutoId">
                        <p id="movProdutoNome" class="fw-bold text-primary fs-5 mb-3"></p>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tipo de Movimentação</label>
                            <select class="form-select" id="movTipo">
                                <option value="ENTRADA">Entrada</option>
                                <option value="SAIDA">Saída</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Quantidade</label>
                            <input type="number" class="form-control" id="movQuantidade" min="1" value="1" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Centro de Custo / Destino</label>
                            <input type="text" class="form-control" id="movCentroCusto" placeholder="Ex: TI / Projeto X" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-success">Confirmar Movimentação</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL NOVA LOCALIDADE -->
    <div class="modal fade" id="modalNovaLocalidade" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="formNovaLocalidade">
                    <div class="modal-header bg-dark text-white">
                        <h5 class="modal-title">Adicionar Nova Localidade</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nome da Localidade / Contrato</label>
                            <input type="text" class="form-control" id="novaLocalidadeNome" placeholder="Ex: Itabira, Contagem" required>
                        </div>
                    </div>
                    <div class="modal-footer bg-light">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Adicionar Localidade</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let localidades = JSON.parse(localStorage.getItem('localidades_ti')) || ["Belo Horizonte", "Barão de Cocais"];
        let localidadeAtual = localidades[0];

        function renderizarAbas() {
            const container = document.getElementById('localidadesTabs');
            container.innerHTML = '';
            localidades.forEach(loc => {
                const li = document.createElement('li');
                li.className = 'nav-item';
                li.innerHTML = `<a class="nav-link ${loc === localidadeAtual ? 'active shadow-sm' : ''}" href="#" onclick="mudarLocalidade('${loc}')"><i class="fa-solid fa-location-dot me-1"></i> ${loc}</a>`;
                container.appendChild(li);
            });
            document.getElementById('tituloLocalidade').innerText = `Localidade: ${localidadeAtual}`;
        }

        function mudarLocalidade(loc) {
            localidadeAtual = loc;
            renderizarAbas();
            carregarProdutos();
        }

        document.getElementById('formNovaLocalidade').addEventListener('submit', function(e) {
            e.preventDefault();
            const nomeLoc = document.getElementById('novaLocalidadeNome').value.trim();
            if(nomeLoc && !localidades.includes(nomeLoc)) {
                localidades.push(nomeLoc);
                localStorage.setItem('localidades_ti', JSON.stringify(localidades));
                mudarLocalidade(nomeLoc);
                document.getElementById('novaLocalidadeNome').value = '';
                bootstrap.Modal.getInstance(document.getElementById('modalNovaLocalidade')).hide();
            } else {
                alert('Localidade já existe ou nome inválido.');
            }
        });

        async function carregarProdutos() {
            try {
                const res = await fetch(`/api/produtos?localidade=${encodeURIComponent(localidadeAtual)}`);
                const produtos = await res.json();
                const tbody = document.getElementById('tabelaProdutos');
                tbody.innerHTML = '';

                if (produtos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Nenhum item cadastrado para ${localidadeAtual}.</td></tr>`;
                    return;
                }

                produtos.forEach(p => {
                    let badgeStatus = p.status_alerta 
                        ? '<span class="badge bg-danger px-2 py-1">Crítico / Baixo</span>' 
                        : '<span class="badge bg-success px-2 py-1">Normal</span>';

                    tbody.innerHTML += `
                        <tr>
                            <td class="ps-3 fw-bold text-dark">${p.nome}</td>
                            <td><span class="text-secondary">${p.categoria}</span></td>
                            <td class="fw-bold fs-6">${p.quantidade}</td>
                            <td>${badgeStatus}</td>
                            <td class="text-end pe-3">
                                <button class="btn btn-sm btn-outline-success me-1" onclick="abrirMovimentacao(${p.id}, '${p.nome}')" title="Entrada/Saída"><i class="fa-solid fa-right-left"></i></button>
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="editarProduto(${p.id}, '${p.nome}', '${p.categoria}', ${p.quantidade}, ${p.alerta_minimo})" title="Editar"><i class="fa-solid fa-pen"></i></button>
                                <button class="btn btn-sm btn-outline-danger" onclick="excluirProduto(${p.id})" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Erro ao carregar produtos:", err);
            }
        }

        document.getElementById('formProduto').addEventListener('submit', async function(e) {
            e.preventDefault();
            const id = document.getElementById('produtoId').value;
            const dados = {
                id: id ? parseInt(id) : null,
                nome: document.getElementById('nomeProduto').value,
                categoria: document.getElementById('categoriaProduto').value,
                quantidade: parseInt(document.getElementById('quantidadeProduto').value),
                alerta_minimo: parseInt(document.getElementById('alertaMinimo').value),
                localidade: localidadeAtual
            };

            const res = await fetch('/api/produtos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const resultado = await res.json();
            alert(resultado.mensagem || resultado.erro);
            bootstrap.Modal.getInstance(document.getElementById('modalProduto')).hide();
            document.getElementById('formProduto').reset();
            document.getElementById('produtoId').value = '';
            carregarProdutos();
        });

        function editarProduto(id, nome, categoria, quantidade, alertaMinimo) {
            document.getElementById('produtoId').value = id;
            document.getElementById('nomeProduto').value = nome;
            document.getElementById('categoriaProduto').value = categoria;
            document.getElementById('quantidadeProduto').value = quantidade;
            document.getElementById('alertaMinimo').value = alertaMinimo;
            document.getElementById('modalProdutoTitulo').innerText = 'Editar Item';
            new bootstrap.Modal(document.getElementById('modalProduto')).show();
        }

        async function excluirProduto(id) {
            if(confirm("Deseja realmente excluir este item?")) {
                const res = await fetch(`/api/produtos/${id}`, { method: 'DELETE' });
                const resultado = await res.json();
                alert(resultado.mensagem || resultado.erro);
                carregarProdutos();
            }
        }

        function abrirMovimentacao(id, nome) {
            document.getElementById('movProdutoId').value = id;
            document.getElementById('movProdutoNome').innerText = `Item: ${nome}`;
            new bootstrap.Modal(document.getElementById('modalMovimentacao')).show();
        }

        document.getElementById('formMovimentacao').addEventListener('submit', async function(e) {
            e.preventDefault();
            const dados = {
                produto_id: parseInt(document.getElementById('movProdutoId').value),
                tipo: document.getElementById('movTipo').value,
                quantidade: parseInt(document.getElementById('movQuantidade').value),
                centro_custo: document.getElementById('movCentroCusto').value
            };

            const res = await fetch('/api/movimentacao', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });
            const resultado = await res.json();
            if(resultado.erro) {
                alert(resultado.erro);
            } else {
                alert(resultado.mensagem);
                if(resultado.alerta) alert(resultado.alerta);
                bootstrap.Modal.getInstance(document.getElementById('modalMovimentacao')).hide();
                document.getElementById('formMovimentacao').reset();
                carregarProdutos();
            }
        });

        renderizarAbas();
        carregarProdutos();
    </script>
</body>
</html>
